name: I18N Localization Check

on:
  pull_request:
    paths:
      - "frontend/src/locales/**/*.json"

# A new push cancels a PR's superseded run; each master commit keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-translations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install python
        run: uv python install

      # Both checks are stdlib-only, so skip resolving the backend project.
      - name: Run localization check
        run: uv run --no-project python frontend/src/locales/check_i18n_locales.py

      - name: Check locale files are sorted
        run: uv run --no-project python frontend/src/locales/check_i18n_sorted.py
