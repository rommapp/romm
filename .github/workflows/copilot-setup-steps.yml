name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:13.0.2
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: passwd
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --health-start-period=30s
      valkey:
        image: valkey/valkey:9.0.6
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend
        uses: ./.github/actions/setup-backend
        with:
          sync-args: --all-extras --dev
          apt-packages: libpq-dev

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Install Trunk CLI
        run: curl https://get.trunk.io -fsSL | bash -s -- -y

      - name: Set up test database
        run: mysql --host 127.0.0.1 --port 3306 -uroot -ppasswd < backend/romm_test/setup.sql
