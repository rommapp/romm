name: Docker Image Check

# Releases and the nightly are the only other builds of docker/Dockerfile, so a
# change to what the image is built from gets built and booted here first.
on:
  pull_request:
    paths:
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/docker-pr.yml

# A new push cancels a PR's superseded run; each master commit keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:13.0.2
        ports:
          - 3306:3306
        env:
          MARIADB_USER: romm
          MARIADB_PASSWORD: passwd
          MARIADB_DATABASE: romm
          MARIADB_ROOT_PASSWORD: passwd
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --health-start-period=30s
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache is public, so fork PRs read it too. Nothing is written back:
      # layers built from PR content must not reach a release image.
      - name: Build the full image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: docker/Dockerfile
          context: .
          platforms: linux/amd64
          target: full-image
          load: true
          tags: romm:pr
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/romm-buildcache:release-amd64

      # Host networking reaches the MariaDB service on localhost. The image
      # generates its own auth key and runs its own valkey when none is set.
      # The watchers and the streaming worker are off by default; turning them
      # on means every longrun in the s6 tree is expected up.
      - name: Start the container
        run: |
          mkdir -p "$RUNNER_TEMP/library" "$RUNNER_TEMP/config"
          printf 'streaming:\n  enabled: true\n' >"$RUNNER_TEMP/config/config.yml"
          docker run -d --name romm --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_NAME=romm \
            -e DB_USER=romm \
            -e DB_PASSWD=passwd \
            -e ENABLE_RESCAN_ON_FILESYSTEM_CHANGE=true \
            -e ENABLE_SYNC_FOLDER_WATCHER=true \
            -v "$RUNNER_TEMP/library:/romm/library" \
            -v "$RUNNER_TEMP/config:/romm/config" \
            romm:pr

      # Startup runs the migrations first, so a green heartbeat also means the
      # image migrated a fresh database.
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/api/heartbeat >/dev/null; then
              echo "API up after ${i}s"
              exit 0
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' romm)" != "true" ]]; then
              echo "::error::The container exited during startup"
              exit 1
            fi
            sleep 1
          done
          echo "::error::The API did not answer within 120s"
          exit 1

      - name: Check the frontend is served
        run: curl -sf http://127.0.0.1:8080/ | grep -q '<div id="app"'

      # s6 restarts a crashed service after a second, so a single "up" reading
      # can hide a crash loop. Each one has to stay up for 15s straight.
      - name: Check every supervised service stays up
        run: |
          mapfile -t services < <(grep -lx longrun docker/s6-overlay/s6-rc.d/*/type | xargs -n1 dirname | xargs -n1 basename)
          echo "Longruns: ${services[*]}"
          for i in $(seq 1 90); do
            pending=()
            for s in "${services[@]}"; do
              read -r up secs < <(docker exec romm /command/s6-svstat -o up,updownfor "/run/service/$s" || true)
              if [[ "$up" != "true" || "${secs:-0}" -lt 15 ]]; then
                pending+=("$s")
              fi
            done
            if ((${#pending[@]} == 0)); then
              echo "All ${#services[@]} services up for 15s after ${i}s"
              exit 0
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' romm)" != "true" ]]; then
              echo "::error::The container exited"
              exit 1
            fi
            sleep 1
          done
          for s in "${pending[@]}"; do
            echo "$s: $(docker exec romm /command/s6-svstat "/run/service/$s" 2>&1)"
          done
          echo "::error::Services not steadily up within 90s: ${pending[*]}"
          exit 1

      - name: Dump container logs
        if: failure()
        run: docker logs romm 2>&1 | tail -200 || true
