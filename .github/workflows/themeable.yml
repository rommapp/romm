name: themeable

on:
  push:
    branches: [themeable]
    paths: ["themeable/**", ".github/workflows/themeable*.yml", "frontend/**", "docker/nginx/**"]
  pull_request:
    branches: [themeable]
  workflow_dispatch:
    inputs:
      default_theme:
        description: Pack id used when a visitor has not picked a theme ("none" for stock)
        default: none

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Unit tests
        working-directory: themeable
        run: npm test
      - name: Upstream compatibility check
        working-directory: themeable
        run: node scripts/check-upstream.mjs --report "$RUNNER_TEMP/report.md"
      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true

  visual:
    needs: test
    uses: ./.github/workflows/themeable-visual.yml
    with:
      ref: ${{ github.sha }}

  image:
    needs: [test, visual]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned RomM version
        id: v
        run: |
          echo "romm=$(cat themeable/ROMM_VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: themeable
          file: themeable/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROMM_VERSION=${{ steps.v.outputs.romm }}
            THEMEABLE_DEFAULT=${{ inputs.default_theme || 'none' }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/romm-themeable:${{ steps.v.outputs.romm }}
            ghcr.io/${{ steps.v.outputs.owner }}/romm-themeable:latest
