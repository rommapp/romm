name: Bound apt network timeouts
description: Make every later apt call on the runner retry and time out instead of hanging on a stalled mirror.

runs:
  using: composite
  steps:
    # apt has no network timeout by default, so a stalled mirror hangs until the job limit.
    # A conf file also covers apt calls made by other tools, such as `playwright install --with-deps`.
    - name: Write the apt timeout config
      shell: bash
      run: |
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
          | sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null
