[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
env =
   ROMM_BASE_PATH=romm_test
   DB_HOST=127.0.0.1
   DB_NAME=romm_test
   DB_USER=romm_test
   DB_PASSWD=passwd
   D:ROMM_DB_DRIVER=mariadb
   IGDB_CLIENT_ID=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   IGDB_CLIENT_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   RETROACHIEVEMENTS_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   MOBYGAMES_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   SCREENSCRAPER_USER=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   SCREENSCRAPER_PASSWORD=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   STEAMGRIDDB_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   LAUNCHBOX_API_ENABLED=true
   ROMM_AUTH_SECRET_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
   ENABLE_RESCAN_ON_FILESYSTEM_CHANGE=true
   ENABLE_SCHEDULED_RESCAN=true
   ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB=true
   ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA=true
   LOGLEVEL=DEBUG
   DEV_MODE=false
   OIDC_ENABLED=false

# Everything our code and the pinned dependencies emitted is fixed at the source,
# so a filter here is upstream noise we cannot clear ourselves.
filterwarnings =
   # starlette's TestClient prefers httpx2, but the app pins httpx 0.27 for its
   # metadata providers. A second HTTP stack just for the test client is a bigger
   # change than the warning is worth until starlette drops httpx.
   ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
