<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="Themes reach RomM through four build-time hooks">
<rect width="760" height="492" rx="12" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<text x="24" y="40" font-size="15" font-weight="600" fill="#1f2328">Themes reach RomM through four hooks; upstream files in the repo stay untouched</text>
<text x="24" y="74" font-size="11.5" font-weight="600" fill="#59636e">Stock RomM release</text>
<text x="276" y="74" font-size="11.5" font-weight="600" fill="#59636e">themeable build hooks</text>
<text x="528" y="74" font-size="11.5" font-weight="600" fill="#59636e">What the browser gets</text>
<rect x="24" y="92" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="36" y="116" font-weight="600" fill="#1f2328">index.html</text>
<text x="36" y="136" font-size="11.5" fill="#59636e">Built entry page of the app,</text>
<text x="36" y="152" font-size="11.5" fill="#59636e">left alone in source</text>
<rect x="276" y="92" width="208" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="288" y="116" font-weight="600" fill="#1f2328">1 · Inject loader</text>
<text x="288" y="136" font-size="11.5" fill="#1f2328">Adds the loader script tag;</text>
<text x="288" y="152" font-size="11.5" fill="#1f2328">refreshes the sw.js revision</text>
<rect x="528" y="92" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="540" y="116" font-weight="600" fill="#1f2328">Loader runs first</text>
<text x="540" y="136" font-size="11.5" fill="#59636e">Sets data-romm-theme and</text>
<text x="540" y="152" font-size="11.5" fill="#59636e">the romm_theme cookie</text>
<path d="M232 128H274" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M484 128H526" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="24" y="184" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="36" y="208" font-weight="600" fill="#1f2328">nginx template</text>
<text x="36" y="228" font-size="11.5" fill="#59636e">Serves stock artwork</text>
<text x="36" y="244" font-size="11.5" fill="#59636e">and favicons</text>
<rect x="276" y="184" width="208" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="288" y="208" font-weight="600" fill="#1f2328">2 · nginx rewrite</text>
<text x="288" y="228" font-size="11.5" fill="#1f2328">Artwork and favicons from</text>
<text x="288" y="244" font-size="11.5" fill="#1f2328">the visitor's theme cookie</text>
<rect x="528" y="184" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="540" y="208" font-weight="600" fill="#1f2328">Artwork by theme</text>
<text x="540" y="228" font-size="11.5" fill="#59636e">Pack file if present,</text>
<text x="540" y="244" font-size="11.5" fill="#59636e">otherwise the stock file</text>
<path d="M232 220H274" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M484 220H526" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="24" y="276" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="36" y="300" font-weight="600" fill="#1f2328">RomM source</text>
<text x="36" y="320" font-size="11.5" fill="#59636e">Administration.vue,</text>
<text x="36" y="336" font-size="11.5" fill="#59636e">backend main.py</text>
<rect x="276" y="276" width="208" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="288" y="300" font-weight="600" fill="#1f2328">3 · Overlay + patches</text>
<text x="288" y="320" font-size="11.5" fill="#1f2328">New files plus two small</text>
<text x="288" y="336" font-size="11.5" fill="#1f2328">patches, applied to copies</text>
<rect x="528" y="276" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="540" y="300" font-weight="600" fill="#1f2328">Branding tab and API</text>
<text x="540" y="320" font-size="11.5" fill="#59636e">Admins choose the theme;</text>
<text x="540" y="336" font-size="11.5" fill="#59636e">Save recompiles the packs</text>
<path d="M232 312H274" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M484 312H526" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="24" y="368" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="36" y="392" font-weight="600" fill="#1f2328">Themes folder</text>
<text x="36" y="412" font-size="11.5" fill="#59636e">/romm/themes on the host,</text>
<text x="36" y="428" font-size="11.5" fill="#59636e">plus built-in packs</text>
<rect x="276" y="368" width="208" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="288" y="392" font-weight="600" fill="#1f2328">4 · Start-up compile</text>
<text x="288" y="412" font-size="11.5" fill="#1f2328">Packs compiled into a</text>
<text x="288" y="428" font-size="11.5" fill="#1f2328">writable folder at boot</text>
<rect x="528" y="368" width="208" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="540" y="392" font-weight="600" fill="#1f2328">Theme overrides</text>
<text x="540" y="412" font-size="11.5" fill="#59636e">theme.css outranks stock</text>
<text x="540" y="428" font-size="11.5" fill="#59636e">tokens on specificity</text>
<path d="M232 404H274" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M484 404H526" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/>
<text x="24" y="472" font-size="11.5" fill="#59636e">Hooks 1 to 3 run when the image is built; hook 4 runs at container start and on every Save in Branding.</text></svg>
