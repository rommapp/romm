[mypy]
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
disable_error_code = import-untyped
enable_error_code = ignore-without-code
# INI configs take a regex here, not a TOML-style list.
exclude = (?x)(^|/)alembic/

# Test functions and fixtures stay unannotated; their bodies are still checked.
[mypy-tests.*,conftest]
disallow_untyped_defs = False

# Built from source only in the Docker image, so absent locally and in CI.
[mypy-sigil]
ignore_missing_imports = True
