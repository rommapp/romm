[mypy]
# Trunk runs mypy from its own venv; this lets it resolve the project's packages.
python_executable = .venv/bin/python
check_untyped_defs = True
disable_error_code = import-untyped
# INI configs take a regex here, not a TOML-style list.
exclude = (?x)(^|/)alembic/

# Built from source only in the Docker image, so absent locally and in CI.
[mypy-sigil]
ignore_missing_imports = True
