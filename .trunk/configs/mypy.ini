[mypy]
strict = True
enable_error_code = ignore-without-code
# Packages that leave the methods we call unannotated. mypy matches a method by
# its receiver's class, so the worker that subclasses rq's is listed too.
untyped_calls_exclude = apprise,mutagen,redis,rq,handler.rq_worker.RomMWorker
# INI configs take a regex here, not a TOML-style list.
exclude = (?x)(^|/)alembic/

# Test functions and fixtures stay unannotated; their bodies are still checked.
[mypy-tests.*,conftest]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

# mutagen ships types but re-exports FileType, File and APIC without __all__.
[mypy-mutagen.*]
implicit_reexport = True

# Built from source only in the Docker image, so absent locally and in CI.
[mypy-sigil]
ignore_missing_imports = True

# Untyped, with no stubs we can use, so their imports are Any.
[mypy-socketio.*,streaming_form_data.*,strsimpy.*,zipfile_inflate64]
ignore_missing_imports = True
