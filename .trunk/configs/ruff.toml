[lint]
# Generic, formatter-friendly config.
# ASYNC: flake8-async.
# B: flake8-bugbear.
# D3: flake8-docstrings (D3xx).
# DTZ: flake8-datetimez, so a date is never read in the server's local time.
# E: pycodestyle errors.
# F: Pyflakes.
# TID251: banned APIs, scoped to backend tests below.
select = ["ASYNC", "B", "D3", "DTZ", "E", "F", "TID251"]

# Never enforce `E501` (line length violations). This should be handled by formatters.
# `DTZ005`: some `datetime.now()` calls stamp file names a person reads, in local time.
ignore = ["DTZ005", "E501"]

# Tests persist rows through the factories in backend/tests/factories.py.
[lint.flake8-tidy-imports.banned-api]
"handler.database.db_platform_handler.add_platform".msg = "Use tests.factories.make_platform"
"handler.database.db_rom_handler.add_rom".msg = "Use tests.factories.make_rom"
"handler.database.db_save_handler.add_save".msg = "Use tests.factories.make_save"
"handler.database.db_state_handler.add_state".msg = "Use tests.factories.make_state"
"handler.database.db_screenshot_handler.add_screenshot".msg = "Use tests.factories.make_screenshot"
"handler.database.db_firmware_handler.add_firmware".msg = "Use tests.factories.make_firmware"
"handler.database.db_client_token_handler.add_token".msg = "Use tests.factories.make_device_token"

[lint.per-file-ignores]
"!**/tests/**" = ["TID251"]
# Tests build naive datetimes on purpose, to check how they're read.
"**/tests/**" = ["DTZ001"]
"**/tests/factories.py" = ["TID251"]
