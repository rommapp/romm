# Please see the full example under examples/docker-compose.example.yml

# Pinned so the default network stays romm_default whatever the checkout
# directory is named; docker-compose.oidc.yml and .streaming.yml join it.
name: romm

services:
  romm-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: romm-dev
    env_file: .env
    environment:
      - REDIS_HOST=romm-valkey-dev
      - DB_HOST=${DB_HOST:-romm-db-dev}
      - ROMM_BASE_PATH=/app/romm
      - PROTON_INSTALL_ROOT=/opt/proton
      - INSTALL_DEFAULT_PROTON_BUILD=cachyos-latest
      # Container name the backend proxies the install VNC view to. Must
      # match the sandbox's container_name below (both read the same variable).
      - INSTALL_WORKER_HOST=${INSTALL_WORKER_HOST:-romm-install-sandbox}
    ports:
      - "3000:3000" # Vite dev server (custom)
      - "5173:5173" # Vite dev server (default)
      - "8443:8443" # HTTPS dev server
      - "5678:5678" # debugpy
      - "${DEV_PORT:-5000}:5000" # Backend API
    volumes:
      - ./backend:/app/backend
      - /app/backend/romm_mock # Empty directory
      - ./frontend:/app/frontend
      - /app/frontend/node_modules # Empty directory
      - /app/frontend/dist # Empty directory
      - ./romm_mock:/app/romm
      - ~/.vite-plugin-mkcert:/app/.vite-plugin-mkcert
      # Read-only, so the backend can report the checked-out branch (see
      # backend/utils/__init__.py get_git_branch) without git write access.
      - ./.git:/app/.git:ro
    depends_on:
      - romm-db-dev
      - romm-valkey-dev
    command: /bin/bash -c "cd /app && bash"
    stdin_open: true
    tty: true

  romm-db-dev:
    image: mariadb:13.0.2
    container_name: romm-db-dev
    restart: unless-stopped
    env_file: .env
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWD:-rootpassword}
      - MARIADB_DATABASE=${DB_NAME:-romm}
      - MARIADB_USER=${DB_USER:-romm}
      - MARIADB_PASSWORD=${DB_PASSWD:-romm}
    volumes:
      - romm-db-dev:/var/lib/mysql
    ports:
      - "3306:3306"

  romm-valkey-dev:
    image: valkey/valkey:9.0.6
    container_name: romm-valkey-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Remote-install sandbox worker (Windows installer support): runs installers
  # under bubblewrap plus a headless X/VNC bridge, consuming only the
  # dedicated "install" RQ queue (see QueuePrio in handler/redis_handler.py) -
  # romm-dev's own worker never picks up an install job, it doesn't carry
  # Wine/Xvfb/bubblewrap. Part of the main stack; comment this service out if
  # you don't want it. There's no separate on/off flag beyond that: romm-dev
  # only offers the "Install" button once it can see a worker registered on
  # the install queue (see handler.install.queue_status.has_install_worker),
  # checked live rather than gated on a static env var.
  romm-install-sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.install-sandbox
    container_name: ${INSTALL_WORKER_HOST:-romm-install-sandbox}
    restart: unless-stopped
    # Cancelling an install stops its RQ job with an uncatchable SIGKILL to
    # the whole process group (Xvfb/x11vnc/websockify/bwrap included), so
    # they die as zombies rather than exiting cleanly. Without a real PID 1
    # to reap them, they'd pile up forever; Docker's built-in init does that.
    init: true
    env_file: .env
    # bubblewrap needs to create a nested user+mount namespace to sandbox the
    # installer. On rootful Docker with unprivileged user namespaces enabled
    # on the host kernel, `cap_add: [SYS_ADMIN]` alone is often enough; on a
    # nested/rootless Docker setup (verified on this dev machine) it isn't -
    # only full `privileged` let bwrap mount its sandboxed /proc. If your
    # host allows the lighter option, trade this for cap_add/security_opt.
    privileged: true
    # Dev override: run as root so the entrypoint's chown of /opt/proton
    # succeeds on unprivileged-userns hosts where Docker can't chown overlay
    # layers at runtime as the non-root image user. Production builds use the
    # Dockerfile's chown (as root during build); dev overrides here.
    user: root
    environment:
      - REDIS_HOST=romm-valkey-dev
      - DB_HOST=${DB_HOST:-romm-db-dev}
      - DB_NAME=${DB_NAME:-romm}
      - DB_USER=${DB_USER:-romm}
      - DB_PASSWD=${DB_PASSWD:-romm}
      - ROMM_BASE_PATH=/app/romm
      - PROTON_INSTALL_ROOT=/opt/proton
      - INSTALL_DEFAULT_PROTON_BUILD=cachyos-latest
    volumes:
      # Same mock library/cache the romm-dev service sees, so files an
      # install writes are visible on both sides without a second volume.
      - ./romm_mock:/app/romm
      # Live-mount the entire backend so dev changes to install config,
      # proton_builds.py, runner.py, etc. are reflected without rebuilding
      # the image (the worker's venv lives at /src/.venv, separate from
      # /src/backend, so this won't clobber dependencies).
      - ./backend:/src/backend:ro
    depends_on:
      - romm-db-dev
      - romm-valkey-dev

volumes:
  romm-db-dev:
