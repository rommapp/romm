# romm-themeable: RomM with theme packs managed from Administration -> Branding.
#
# Production deployment. On the themeable branch this file replaces upstream RomM's
# root docker-compose.yml, which is a development stack (it is unchanged on master,
# and DEVELOPER_SETUP.md describes it). It differs from upstream's
# examples/docker-compose.example.yml in the image, the themes volume, pinned
# versions, health checks and log limits.
#
# Before the first start:
#   1. Replace every /path/to/... with a real folder on the host.
#   2. Fill in every value marked REQUIRED. Use `openssl rand -hex 32` for secrets.
#   3. From this folder, run `docker compose up -d` and open http://<host>/ to create
#      the admin account.
#
# The theme module is part of the image; nothing else needs installing. At every
# start the container compiles the packs in the themes folder (and the built-in
# ones), then serves the theme selected in Administration -> Branding. If a pack is
# broken, RomM still starts with its default look. Theme packs are covered in
# themeable/docs/creating-a-theme-pack.md in the repository.
#
# Upgrading: change the image tag to the new RomM version (romm-themeable images
# are tagged with the RomM release they are built from), then
# `docker compose pull && docker compose up -d`. Back up the database first.

# Keeps container, network and volume names the same whatever the folder is called.
name: romm

volumes:
  mysql_data:
  romm_resources:
  romm_redis_data:

services:
  romm:
    # Pinned to the RomM release this image is built from. :latest also exists, but
    # a pinned tag keeps upgrades deliberate.
    image: ghcr.io/stealthx3/romm-themeable:5.4.0
    # To build the image on this machine instead of pulling it, uncomment the block
    # below and run `docker compose up -d --build` from a clone of
    # https://github.com/Stealthx3/romm-themeable (themeable branch):
    # build:
    #   context: .
    #   dockerfile: themeable/docker/Dockerfile
    #   args:
    #     ROMM_VERSION: 5.4.0
    # pull_policy: build
    container_name: romm
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC # Time zone for logs and save names, e.g. America/New_York
      - DB_HOST=romm-db
      - DB_NAME=romm # Must match MARIADB_DATABASE below
      - DB_USER=romm-user # Must match MARIADB_USER below
      - DB_PASSWD= # REQUIRED. Must match MARIADB_PASSWORD below
      - ROMM_AUTH_SECRET_KEY= # REQUIRED. Generate with `openssl rand -hex 32`
      # - ROMM_BASE_URL=https://romm.example.com # Public URL, if RomM is behind a reverse proxy
      - ROMM_SESSION_SECURE_COOKIE=false # Set to true when RomM is served over HTTPS
      - SCREENSCRAPER_USER= # Recommended metadata providers:
      - SCREENSCRAPER_PASSWORD= # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#screenscraper
      - RETROACHIEVEMENTS_API_KEY= # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#retroachievements
      - STEAMGRIDDB_API_KEY= # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#steamgriddb
      - HASHEOUS_API_ENABLED=true # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
      - SCAN_WORKERS=4 # How many ROMs to scan at once
      - WEB_SERVER_CONCURRENCY=4 # Workers for API calls; raise for several concurrent users
      # Theme module. The image's defaults are shown; change them only if you need to.
      # - THEMEABLE_PACKS_PATH=/romm/themes # Where the container looks for theme packs
      # - THEMEABLE_RUNTIME_DIR=/tmp/themeable # Where compiled themes and status.json go
    volumes:
      - romm_resources:/romm/resources # Covers, screenshots and other fetched metadata
      - romm_redis_data:/redis-data # Cache for background tasks
      - /path/to/library:/romm/library # Your game library: https://docs.romm.app/latest/Getting-Started/Folder-Structure/
      - /path/to/assets:/romm/assets # Uploaded saves, states, etc.
      - /path/to/config:/romm/config # Holds config.yml (optional)
      - /path/to/themes:/romm/themes # Theme packs, one folder each. Must be writable: Branding saves the selected theme here as themeable.json
      # - /path/to/sync:/romm/sync # Required for ENABLE_SYNC_FOLDER_WATCHER; holds the SSH keys for ENABLE_SYNC_PUSH_PULL
    ports:
      - 80:8080
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/heartbeat"]
      start_period: 120s # Database migrations and theme compilation run at start
      start_interval: 10s
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  romm-db:
    image: mariadb:11.8 # LTS release. Change the major version only after a backup
    container_name: romm-db
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC
      - MARIADB_ROOT_PASSWORD= # REQUIRED. A unique, strong password
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD= # REQUIRED. Same value as DB_PASSWD above
      - MARIADB_AUTO_UPGRADE=1 # Upgrade system tables after a minor version change
    volumes:
      - mysql_data:/var/lib/mysql
    # No ports published: only RomM reaches the database, over the compose network.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
