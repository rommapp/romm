# This is a generic example of a configuration file
# Rename this file to `config.yml`, copy it to a `config` folder, and mount that folder as per the docker-compose.example.yml
# Only uncomment the lines you want to use/modify, or add new ones where needed

# exclude:
#   # Exclude platforms to be scanned
#   platforms:
#     - excluded_folder_a
#     - excluded_folder_b

#   # Exclude ROMs or parts of ROMs to be scanned
#   roms:
#     # Single file games section.
#     # Will not apply to files that are in sub-folders (multi-disc ROMs, games with updates, DLC, patches, etc.)
#     single_file:
#       # Exclude all files with certain extensions to be scanned
#       extensions:
#         - xml
#         - txt

#       # Exclude matched file names to be scanned
#       # Supports unix filename pattern matching
#       names:
#         - 'info.txt'
#         - '._*'
#         - '*.nfo'

#     # Multi files games section
#     # Will apply to files that are in sub-folders (multi-disc ROMs, games with updates, DLC, patches, etc.)
#     multi_file:
#       # Exclude matched 'folder' names to be scanned (RomM identifies folders as multi file games)
#       # Common ES-DE media folders are listed below
#       names:
#         - 3dboxes
#         - backcovers
#         - covers
#         - fanart
#         - manuals
#         - marquees
#         - miximages
#         - physicalmedia
#         - screenshots
#         - titlescreens
#         - videos
#         - downloaded_media
#         - media

#       # Exclude files within sub-folders.
#       parts:
#         # Exclude matched file names to be scanned from multi file roms
#         # Keep in mind that RomM doesn't scan folders inside multi files games,
#         # so there is no need to exclude folders from inside of multi files games.
#         names:
#           - 'data.xml'
#           - '._*' # Supports unix filename pattern matching

#         # Exclude all files with certain extensions to be scanned from multi file roms
#         extensions:
#           - xml
#           - txt

# system:
#   # Asociate different platform names to your current file system platform names
#   # [your custom platform folder name]: [RomM platform name]
#   # In this example if you have a 'gc' folder, RomM will treat it like the 'ngc' folder
#   platforms:
#     gc: ngc
#     ps1: psx

#   # Asociate one platform to it's main version (IGDB only)
#   versions:
#     naomi: arcade

# filesystem:
#   # Custom games folder name only (eg. `retro_games/`)
#   roms_folder: 'roms'
#   # Skip file hash calculations on low power devices (eg. Raspberry PI)
#   skip_hash_calculation: false

# scan:
#   # Metadata priority during scans
#   priority:
#     # Below are the default priority values used
#     metadata: # Top-level metadata source priority
#       - igdb # IGDB (highest priority)
#       - moby # MobyGames
#       - ss # Screenscraper
#       - ra # RetroAchievements
#       - launchbox # Launchbox
#       - gamelist # ES-DE gamelist.xml
#       - hasheous # Hasheous
#       - flashpoint # Flashpoint Project
#       - hltb # HowLongToBeat (lowest priority)
#     artwork: # Cover art and screenshots
#       - igdb # IGDB
#       - moby # MobyGames
#       - ss # Screenscraper
#       - ra # RetroAchievements
#       - launchbox # Launchbox
#       - libretro # Libretro
#       - gamelist # ES-DE gamelist.xml
#       - hasheous # Hasheous
#       - flashpoint # Flashpoint Project
#       - hltb # HowLongToBeat
#     # Optional per-field overrides, each falls back to "artwork" when omitted
#     cover: # Cover art only
#       - igdb
#       - ss
#     screenshot: # Screenshots only
#       - ss
#       - igdb
#     manual: # Game manuals only
#       - launchbox
#     region: # Used by IGDB and ScreenScraper for regional variants
#       - us
#       - wor
#       - ss
#       - eu
#       - jp
#     region_mode: prefer_rom_tags # Region tags win over priority list
#     language: # Used by ScreenScraper for descriptions
#       - en
#       - fr
#   # Media assets to download
#   # Only used by Screenscraper and ES-DE gamelist.xml
#   media:
#     # Used as alternative cover art
#     - box2d  # Normal cover art (always enabled)
#     - box3d  # 3D box art
#     - miximage  # Mixed image of multiple media (v1 / mixrbv1)
#     - miximage_v2  # Mixed image of multiple media (v2 / mixrbv2)
#     - physical  # Disc, cartridge, etc.
#     # Added to the screenshots carousel
#     - screenshot  # Screenshot (enabled by default)
#     # Shown in the artwork gallery
#     - title_screen  # Title screen
#     - fanart  # User uploaded artwork
#     # Bezel displayed around the emulatorjs window
#     - bezel
#     # Manual in PDF format
#     - manual # Manual (enabled by default)
#     # Gameplay video
#     - video  # Video (warning: large file size)
#     - video_normalized  # Normalized video (smaller file size than video)
#     # Media used for batocera gamelist.xml export
#     - box2d_back  # Back cover art
#     - box2d_side  # Box spine (enables the interactive 3D box on detail pages)
#     - logo  # Transparent logo
#     # Other media assets (might be used in the future)
#     - marquee  # Custom marquee
#   # Auto-export metadata files after scan completes
#   gamelist:
#     export: false # Whether to export gamelist.xml for ES-DE/Batocera/RetroBAT
#     media:
#       # Select a media type from the list above (eg. box2d, screenshot, etc.)
#       thumbnail: box2d # Use as the <thumbnail> tag in the exported gamelist.xml
#       image: screenshot  # Use as the <image> tag in the exported gamelist.xml
#   pegasus:
#     export: false # Whether to export metadata.pegasus.txt for Pegasus

# EmulatorJS per-core options
# emulatorjs:
#   debug: true # Available options will be logged to the browser console
#   cache_limit: null # Cache limit per ROM (in bytes)
#   disable_batch_bootup: false
#   disable_auto_unload: false
#   settings:
#     parallel_n64: # Use the exact core name
#       vsync: disabled
#     snes9x:
#       snes9x_region: ntsc
#     default: # These settings apply to all cores
#       fps: show
#   netplay:
#     enabled: true
#     ice_servers:
#       - urls: "stun:stun.relay.metered.ca:80"
#       - urls: "turn:global.relay.metered.ca:80"
#         username: "<username>"
#         credential: "<password>"
#   controls: # https://emulatorjs.org/docs4devs/control-mapping/
#     snes9x:
#       0: # Player 1
#         0: # A MAPPING FOR EACH BUTTON MUST BE SET!
#           value: x # Mapping for keyboard
#           value2: BUTTON_2 # Mapping for connected controller
#       1: # Player 2
#       2: # Player 3
#       3: # Player 4

# Emulator streaming: play a ROM through a real emulator running in a
# webstation container (https://github.com/romm-streaming/romm-broker),
# streamed into the browser instead of RomM's built-in web cores.
# `protocol: webstation` is the only supported container type; see
# docs/STREAMING_MIGRATION.md if you are still on the per-emulator broker mods
# (containers with a bare `platform:` key and no `protocol`), which are
# deprecated and will stop working in a future release.
#
# Every platform the broker can serve is listed under `platforms` below.
# Uncomment the section, then delete or comment out the platforms you don't
# have ROMs for. Platform keys are RomM platform slugs (the same names as your
# library folders, after any `system.platforms` binding above).
#
# A platform is served by one emulator. Where the broker offers more than one,
# the alternative is shown commented out on the line below; swap them by
# moving the `#`. Emulator names, and what each one can do:
#
#   Standalone (one platform family each):
#     pcsx2        PlayStation 2      save states, memory card, manual disc swap
#     duckstation  PlayStation        resume state on exit only
#     dolphin      GameCube, Wii      save states, GameCube memory card
#     ppsspp       PSP                save states
#     flycast      Dreamcast          resume state on exit only
#     cemu         Wii U              no states, game saves only
#     azahar       3DS                no states, game saves only
#     eden         Switch             no states, game saves only
#     rpcs3        PlayStation 3      resume state on exit only
#     shadps4      PlayStation 4      no states, game saves only
#     xemu         Xbox               no states, game saves only
#     xenia        Xbox 360           no states, game saves only
#   General purpose:
#     retroarch    a libretro core picked per platform (see each platform's
#                  comment). One shared save/resume slot, live disc swap on
#                  dc, saturn, segacd, turbografx-cd and dos playlists.
#
# Many RetroArch cores need a BIOS in the container before they boot; see
# https://romm-streaming.github.io/romm-broker/docs/emulators/retroarch-cores
#
# streaming:
#   enabled: true
#   containers:
#     # One container serving many platforms. Every key on the container is the
#     # default for every platform it serves; a platform block overrides it.
#     # A platform block may only override emulator, label, and memory_card_sync.
#     - protocol: webstation
#       # Browser-facing Selkies web UI, MUST be served over https
#       # (use a reverse proxy or the built in self signed cert for linuxserver)
#       # can also be a FQDN eg. https://your.example.com, or a same-origin
#       # path eg. /streaming when the container is proxied under RomM's host.
#       host: https://192.168.1.56:3010
#       # URL prefix the broker is served under, matching the container's
#       # SUBFOLDER setting.
#       subfolder: /streaming
#       # Where the container mounts your ROM library.
#       library_path: /romm
#       # Shared secret matching the container's BROKER_SECRET. Can also be
#       # given to RomM as the STREAMING_BROKER_SECRET environment variable,
#       # which wins over this key for every container.
#       broker_secret: change-me
#       # Name of the container in admin views. The play button is labelled by
#       # the emulator serving each platform ("PCSX2", "RA Snes9x"), unless a
#       # platform block sets its own `label` below.
#       label: Emulation station
#
#       # server-to-broker URL. Optional here, where the broker shares the
#       # host and port above. Still required when `host` is a reverse-proxied
#       # path (eg. /streaming), which carries no address RomM can dial, and
#       # when `host` is https with a self-signed certificate (as above),
#       # since the broker calls verify certificates. In those cases point it
#       # at the plain-http address:
#       broker_host: http://192.168.1.56:3010
#
#       platforms:
#         # A platform is either the emulator that serves it...
#         #   snes: retroarch
#         # ...or a block overriding container keys for that platform alone.
#         #   ps2:
#         #     emulator: pcsx2
#         #     label: PCSX2
#         #     memory_card_sync: true
#
#         # ---- Sony ----
#         # DuckStation has no mid-session states, only a resume state on exit.
#         # The SwanStation core needs a PS1 BIOS (eg. scph5501.bin).
#         psx: duckstation
#         # psx: retroarch          # SwanStation core
#         ps2:
#           emulator: pcsx2
#           # Opt in to whole memory-card sync: the user's entire PS2 memory
#           # card is hydrated onto the container at claim and evacuated back
#           # on exit, instead of syncing individual in-game save files.
#           # Only ps2 and ngc have a memory card. On any other platform the
#           # flag is ignored with a warning.
#           memory_card_sync: true
#         # Both PSP options have save states. The RetroArch core needs no
#         # BIOS and shares RetroArch's hotkeys with every other core.
#         psp: retroarch          # PPSSPP core
#         # psp: ppsspp           # standalone PPSSPP
#         ps3: rpcs3              # PKG, extracted folder or disc image
#         ps4: shadps4
#
#         # ---- Nintendo ----
#         nes: retroarch          # Mesen
#         famicom: retroarch      # Mesen
#         fds: retroarch          # Mesen, needs disksys.rom
#         snes: retroarch         # Snes9x
#         sfam: retroarch         # Snes9x
#         n64: retroarch          # Mupen64Plus-Next
#         gb: retroarch           # Gambatte
#         gbc: retroarch          # Gambatte
#         gba: retroarch          # mGBA, gba_bios.bin optional
#         virtualboy: retroarch   # Beetle VB
#         nds: retroarch          # melonDS, real firmware optional
#         # Standalone Dolphin has slot save states and a GameCube memory
#         # card; the RetroArch core has the shared single slot.
#         ngc:
#           emulator: dolphin
#           memory_card_sync: true
#         # ngc: retroarch        # Dolphin core
#         wii: dolphin
#         # wii: retroarch        # Dolphin core
#         # 3DS: the RetroArch core is the better option, standalone Azahar
#         # has no control interface so exit is a plain kill.
#         3ds: retroarch          # Azahar core
#         # 3ds: azahar           # standalone Azahar
#         wiiu: cemu
#         switch: eden
#
#         # ---- Microsoft ----
#         xbox: xemu
#         xbox360: xenia          # XISO, .xex, extracted dump or XBLA folder
#
#         # ---- Sega ----
#         genesis: retroarch      # Genesis Plus GX
#         sms: retroarch          # Genesis Plus GX
#         gamegear: retroarch     # Genesis Plus GX
#         sg1000: retroarch       # Genesis Plus GX
#         segacd: retroarch       # Genesis Plus GX, needs region CD BIOS
#         sega32: retroarch       # PicoDrive
#         saturn: retroarch       # Yaba Sanshiro, needs Saturn BIOS
#         # Dreamcast needs dc_boot.bin and dc_flash.bin either way. The
#         # RetroArch core adds live disc swap; standalone Flycast only
#         # writes a resume state on exit.
#         dc: retroarch           # Flycast core
#         # dc: flycast           # standalone Flycast
#
#         # ---- NEC ----
#         tg16: retroarch         # Beetle PCE
#         supergrafx: retroarch   # Beetle SuperGrafx
#         turbografx-cd: retroarch # Beetle PCE, needs System Card (syscard3.pce)
#
#         # ---- SNK and arcade ----
#         # FinalBurn Neo needs MAME-compatible non-merged romsets; Neo Geo
#         # additionally needs neogeo.zip.
#         arcade: retroarch       # FinalBurn Neo
#         cps1: retroarch         # FinalBurn Neo
#         cps2: retroarch         # FinalBurn Neo
#         cps3: retroarch         # FinalBurn Neo
#         neogeoaes: retroarch    # FinalBurn Neo
#         neogeomvs: retroarch    # FinalBurn Neo
#         neo-geo-cd: retroarch   # NeoCD, needs Neo Geo CD BIOS
#         neo-geo-pocket: retroarch       # Beetle NGP
#         neo-geo-pocket-color: retroarch # Beetle NGP
#
#         # ---- Atari ----
#         atari2600: retroarch    # Stella
#         atari5200: retroarch    # a5200, needs 5200.rom
#         atari7800: retroarch    # ProSystem
#         lynx: retroarch         # Handy
#         jaguar: retroarch       # Virtual Jaguar, no save states
#         atari-st: retroarch     # Hatari, needs TOS ROM
#
#         # ---- Other consoles and handhelds ----
#         wonderswan: retroarch        # Beetle WonderSwan
#         wonderswan-color: retroarch  # Beetle WonderSwan
#         3do: retroarch          # Opera, needs boot ROM (eg. panafz10.bin)
#         colecovision: retroarch # Gearcoleco, needs coleco.rom
#         intellivision: retroarch # FreeIntv, needs exec.bin and grom.bin
#         vectrex: retroarch      # vecx
#         odyssey-2: retroarch    # O2EM, needs o2rom.bin
#
#         # ---- Home computers ----
#         dos: retroarch          # DOSBox Pure
#         amiga: retroarch        # PUAE, needs Kickstart ROM
#         c64: retroarch          # VICE x64
#         msx: retroarch          # blueMSX, needs machine ROMs
#         msx2: retroarch         # blueMSX, needs machine ROMs
#         zxs: retroarch          # Fuse
#
#     # A webstation container can also serve a single platform, if you'd
#     # rather run one container per emulator than share one across all of
#     # them. It's still one `platforms` entry, not the bare `platform:` key
#     # the old per-emulator broker mods used.
#     # - host: https://192.168.1.51:3001
#     #   protocol: webstation
#     #   subfolder: /streaming
#     #   broker_secret: change-me
#     #   label: Emulation station
#     #   platforms:
#     #     ps2:
#     #       emulator: pcsx2
#     #       memory_card_sync: true
